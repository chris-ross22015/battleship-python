name: CI - Python Code Quality & Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  # Centralize action and tool versions here for easy copy-paste maintenance
  PYTHON_VERSION_FILE: ".python-version"
  RUFF_VERSION: "0.8.0"
  PYTEST_VERSION: "8.3.4"

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint (Ruff) & Test (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install CI tools and project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff static linter
        run: ruff check .

      - name: Run Pytest unit tests
        run: |
          # Runs pytest if test files exist; exits cleanly (code 5 -> 0) if none are added yet
          pytest || [ $? -eq 5 ]

          
name: Build Standalone Executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Battleship-Windows.exe
            binary_path: dist/Battleship.exe
          - os: macos-latest
            artifact_name: Battleship-macOS
            binary_path: dist/Battleship
          - os: ubuntu-latest
            artifact_name: Battleship-Linux
            binary_path: dist/Battleship

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Install Linux Tkinter dependency
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name "Battleship" battleship/battleship.py

      - name: Rename binary for release
        run: |
          mv ${{ matrix.binary_path }} ${{ matrix.artifact_name }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
